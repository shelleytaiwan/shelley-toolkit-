<title>Shelley的AI工具彙整</title>
<style>
  :root{
    --bg: #ffffff;
    --ink: #2b2b30;
    --ink-soft: #6b6b74;
    --hairline: #ebe8e2;
    --ring-blue: #5b8dbe;
    --ring-blue-soft: #eaf1f8;
    --ring-black: #45454c;
    --ring-black-soft: #ececee;
    --ring-red: #c9705f;
    --ring-red-soft: #f8ece9;
    --ring-gold: #cf9c42;
    --ring-gold-soft: #f8f0df;
    --ring-green: #5c9c76;
    --ring-green-soft: #eaf3ee;
    --gap: clamp(20px, 4.5vw, 44px);
    --circle: clamp(90px, 15.8vw, 156px);
  }

  *{ box-sizing:border-box; }

  body{
    background: var(--bg);
    color: var(--ink);
    margin:0;
    font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding-inline: 20px;
  }

  .page{
    max-width: 880px;
    margin: 0 auto;
    padding-block: clamp(40px, 8vh, 88px) clamp(48px, 8vh, 88px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: clamp(40px, 7vh, 72px);
  }

  header{
    text-align:center;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  h1{
    font-family:"Noto Serif TC", serif;
    font-weight:700;
    font-size: clamp(28px, 4.6vw, 44px);
    letter-spacing: 0.01em;
    margin:0;
    color: var(--ink);
    text-wrap: balance;
  }

  .kicker{
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform:uppercase;
    color: var(--ink-soft);
    margin:0;
  }

  .subtitle{
    font-size: clamp(14px, 1.6vw, 16px);
    color: var(--ink-soft);
    margin:0;
  }

  .rings-grid{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    column-gap: var(--gap);
    row-gap: clamp(36px, 6vh, 56px);
    width:100%;
    max-width: 760px;
  }

  .ring-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
    text-decoration:none;
    color:inherit;
    outline-offset:6px;
  }

  .ring-item:nth-child(1){ grid-column: 1 / 3; grid-row: 1; }
  .ring-item:nth-child(2){ grid-column: 3 / 5; grid-row: 1; }
  .ring-item:nth-child(3){ grid-column: 5 / 7; grid-row: 1; }
  .ring-item:nth-child(4){ grid-column: 2 / 4; grid-row: 2; }
  .ring-item:nth-child(5){ grid-column: 4 / 6; grid-row: 2; }

  .circle{
    width: var(--circle);
    height: var(--circle);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--ring-soft);
    border: 3px solid var(--ring-color);
    transition: transform .22s ease, box-shadow .22s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }

  .ring-item:nth-child(1) .circle{ --ring-color: var(--ring-blue); --ring-soft: var(--ring-blue-soft); }
  .ring-item:nth-child(2) .circle{ --ring-color: var(--ring-black); --ring-soft: var(--ring-black-soft); }
  .ring-item:nth-child(3) .circle{ --ring-color: var(--ring-red); --ring-soft: var(--ring-red-soft); }
  .ring-item:nth-child(4) .circle{ --ring-color: var(--ring-gold); --ring-soft: var(--ring-gold-soft); }
  .ring-item:nth-child(5) .circle{ --ring-color: var(--ring-green); --ring-soft: var(--ring-green-soft); }

  .circle img{
    width: 62%;
    height: 62%;
    object-fit: contain;
    border-radius: 22%;
    display:block;
  }

  .ring-item:hover .circle,
  .ring-item:focus-visible .circle{
    transform: translateY(-4px);
    box-shadow: 0 10px 22px -10px rgba(0,0,0,.18);
  }

  .label{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .label .title{
    font-weight:700;
    font-size: clamp(15px, 1.85vw, 18px);
    letter-spacing: 0.02em;
  }

  .label .url{
    font-size: 12.5px;
    color: var(--ink-soft);
    word-break: break-all;
  }

  .ring-item:nth-child(1) .title{ color: var(--ring-blue); }
  .ring-item:nth-child(2) .title{ color: var(--ring-black); }
  .ring-item:nth-child(3) .title{ color: var(--ring-red); }
  .ring-item:nth-child(4) .title{ color: var(--ring-gold); }
  .ring-item:nth-child(5) .title{ color: var(--ring-green); }

  footer{
    border-top: 1px solid var(--hairline);
    padding-top: 20px;
    width:100%;
    max-width: 760px;
    text-align:center;
  }

  footer p{
    margin:0;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }

  @media (max-width: 620px){
    .rings-grid{
      grid-template-columns: repeat(2, 1fr);
      row-gap: clamp(28px, 6vh, 40px);
      max-width: 360px;
    }
    .ring-item:nth-child(1){ grid-column: 1 / 2; grid-row: 1; }
    .ring-item:nth-child(2){ grid-column: 2 / 3; grid-row: 1; }
    .ring-item:nth-child(3){ grid-column: 1 / 2; grid-row: 2; }
    .ring-item:nth-child(4){ grid-column: 2 / 3; grid-row: 2; }
    .ring-item:nth-child(5){ grid-column: 1 / 3; grid-row: 3; justify-self:center; }
  }
</style>
